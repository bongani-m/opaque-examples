[package]
name = "opaque-examples"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# Same pins as a production opaque-ke 4 deployment that talks to libopaque.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["argon2", "ristretto255"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["digest", "rand_core", "zeroize"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
